name: DSH Debug Plugin CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: dsh-plugin-debug-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check
        working-directory: packages/dsh-plugin-debug

  windows-debug-suite:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify publication boundary (Windows PowerShell)
        shell: powershell
        run: .\scripts\Verify-Publication.ps1
      - name: Verify publication boundary (PowerShell 7)
        shell: pwsh
        run: ./scripts/Verify-Publication.ps1
      - name: Run combined plugin integration
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHPluginIntegration.ps1
      - name: Install pinned DSH runtime
        shell: pwsh
        run: npm ci --prefix ./packages/dsh-plugin-debug/tools/runtime --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 |
            Where-Object { $_.FullName -notmatch '(?i)[\\/]node_modules[\\/]|[\\/]\.git[\\/]' } |
            ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $errors += $_.FullName }
          }
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Run standalone combined debug suite
        id: standalone
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'dsh-standalone.log'
          & .\packages\dsh-plugin-debug\Test-DSHStandalone.ps1 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Run resource-pressure regression
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHResourcePressure.ps1
      - name: Run incident runtime-evidence regression
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHIncidentRuntimeEvidence.ps1
      - name: Run diagnostics-diff regression
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHDiagnosticsDiff.ps1
      - name: Run plugin-preflight regression
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHPreflight.ps1
      - name: Run dependency-graph regression
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHDependencyGraph.ps1
      - name: Run trace-loop regression
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHTraceLoop.ps1
      - name: Run trace-recursion regression
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHTraceRecursion.ps1
      - name: Run observer-only Guardian status regression
        shell: powershell
        run: .\packages\dsh-plugin-debug\tools\Test-DSHGuardianStatus.ps1
      - name: Run Guard and recovery regressions
        shell: powershell
        run: |
          .\packages\dsh-plugin-debug\tools\Test-DSHGuard.ps1
          .\packages\dsh-plugin-debug\tools\Test-DSHPluginHealth.ps1
          .\packages\dsh-plugin-debug\tools\Test-DSHPluginState.ps1
          .\packages\dsh-plugin-debug\tools\Test-DSHRecovery.ps1
      - name: Collect Windows debug-suite diagnostics
        if: always()
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'dsh-debug-suite-artifacts'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $summary = [ordered]@{
            schemaVersion = 1
            repository = $env:GITHUB_REPOSITORY
            sha = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            job = $env:GITHUB_JOB
            os = [System.Environment]::OSVersion.VersionString
            powershell = $PSVersionTable.PSVersion.ToString()
            node = (& node --version 2>$null | Out-String).Trim()
            standaloneLog = (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'dsh-standalone.log') -PathType Leaf)
          }
          $summary | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $artifactRoot 'summary.json') -Encoding UTF8
          $tempDirs = @(Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'dsh-provenance-standalone-*' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 20 Name,LastWriteTime)
          $tempDirs | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $artifactRoot 'standalone-temp-directories.json') -Encoding UTF8
          $standaloneLog = Join-Path $env:RUNNER_TEMP 'dsh-standalone.log'
          if (Test-Path -LiteralPath $standaloneLog -PathType Leaf) {
            Copy-Item -LiteralPath $standaloneLog -Destination (Join-Path $artifactRoot 'dsh-standalone.log') -Force
          }
      - name: Upload Windows debug-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-debug-suite-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/dsh-debug-suite-artifacts
          if-no-files-found: warn

  fresh-clone:
    name: Fresh clone publication gate
    needs:
      - node-tests
      - windows-debug-suite
    if: ${{ needs.node-tests.result == 'success' && needs.windows-debug-suite.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Clone the exact GitHub commit into a new directory
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: fresh-clone
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run fresh-clone package checks
        shell: pwsh
        working-directory: fresh-clone
        run: |
          npm run check --prefix packages/dsh-plugin-debug
          ./scripts/Verify-Publication.ps1
