name: 功能建议
description: 建议一个能被测试、能说明安全边界的新功能。
title: "[功能] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先确认建议不是已有动作的别名或文档缺口。涉及日志、会话、工具参数、凭据或自动修复时，请一并说明隐私和权限边界。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在什么场景不方便、容易误判或无法验证？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 请写出输入、输出、失败时的结果，以及不会执行或不会写入什么。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 你希望用哪条命令、fixture 或真实环境证明它可用？
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 安全确认
      options:
        - label: 我没有在 issue 中粘贴 Token、Cookie、原始 Tool 参数/结果、会话正文或完整本地路径。
          required: true
