name: DSH diagnostic report
description: Report a DSH plugin, CSS, Slot, or browser-side problem with a sanitized report.
title: "[诊断] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先在“设置 → 插件 → 鼠标溯源 → 诊断”中重新扫描，然后复制或下载报告。
        分享前请删除 API Token、Cookie、Authorization、用户输入、文件路径和其他业务数据。
  - type: textarea
    id: symptom
    attributes:
      label: 问题现象
      description: 请说明你看到了什么、预期是什么，以及是否能稳定复现。
      placeholder: 例如：打开诊断页后，某个 CSS class 被显示为两个插件来源。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: DSH 版本、Profile 名称、浏览器和操作系统。
  - type: textarea
    id: report
    attributes:
      label: 脱敏后的 JSON 报告
      description: 粘贴复制的 JSON，或拖入下载的 diagnostics JSON 文件。
      render: json
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已检查报告，没有 API Token、Cookie、Authorization 或不应公开的业务数据。
          required: true
